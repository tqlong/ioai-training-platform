[project]
name = "ioai-training-platform"
version = "0.0.0"
description = "IOAI Training Platform monorepo for Release 0."
requires-python = ">=3.12"
dependencies = [
]

[project.optional-dependencies]
dev = [
]

[dependency-groups]
backend = [
    "alembic>=1.13,<2",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]
backend-dev = [
    "httpx2>=2,<3",
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]
frontend = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["backend/src"]
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["backend/src", "backend"]
addopts = "-q"

[tool.uv]
package = false
