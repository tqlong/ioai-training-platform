services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ioai
      POSTGRES_PASSWORD: ioai
      POSTGRES_DB: ioai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioai -d ioai"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_USER: ioai_test
      POSTGRES_PASSWORD: ioai_test
      POSTGRES_DB: ioai_test
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioai_test -d ioai_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app:cached
    environment:
      IOAI_DATABASE_URL: postgresql+psycopg://ioai:ioai@postgres:5432/ioai
      IOAI_ALLOWED_ORIGINS: "${IOAI_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001}"
      PYTHONPATH: /app/backend/src
      UV_PROJECT_ENVIRONMENT: /tmp/ioai-venv
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -lc "uv run --with pydantic,fastapi,sqlalchemy,alembic,psycopg[binary],pytest,ruff,pyright,uvicorn uvicorn ioai.entrypoints.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 20

  learn:
    image: node:22-bookworm
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app:cached
    environment:
      CI: "true"
      API_INTERNAL_BASE: http://api:8000
    depends_on:
      api:
        condition: service_started
    command: sh -lc "corepack pnpm install --frozen-lockfile && corepack pnpm --dir frontend/apps/learn dev --hostname 0.0.0.0 --port 3000"
    ports:
      - '3000:3000'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/problems"]
      interval: 10s
      timeout: 5s
      retries: 10

  studio:
    image: node:22-bookworm
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app:cached
    environment:
      API_INTERNAL_BASE: http://api:8000
    depends_on:
      api:
        condition: service_started
      learn:
        condition: service_healthy
    command: sh -lc "corepack pnpm --dir frontend/apps/studio dev --hostname 0.0.0.0 --port 3001"
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/author/problems"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  postgres-test-data:
