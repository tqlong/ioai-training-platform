services:
  postgres:
    environment:
      POSTGRES_DB: ioai_recovery_source
    ports: !override
      - '127.0.0.1:55442:5432'

  api:
    environment:
      IOAI_DATABASE_URL: postgresql+psycopg://ioai:ioai@postgres:5432/ioai_recovery_source
      IOAI_ALLOWED_ORIGINS: http://127.0.0.1:58010
      IOAI_ENVIRONMENT: recovery-verification
    ports: !override
      - '127.0.0.1:58010:8000'
