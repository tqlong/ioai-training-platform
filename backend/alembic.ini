[alembic]
script_location = backend/alembic
sqlalchemy.url = postgresql+psycopg://ioai:ioai@127.0.0.1:5432/ioai
prepend_sys_path = ..

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
